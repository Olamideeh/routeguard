services:
  app:
    build:
      context: .
    container_name: routeguard-app
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/routeguard_db
      SPRING_DATASOURCE_USERNAME: routeguard_user
      SPRING_DATASOURCE_PASSWORD: routeguard_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MINUTES: 60
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: routeguard-postgres
    environment:
      POSTGRES_DB: routeguard_db
      POSTGRES_USER: routeguard_user
      POSTGRES_PASSWORD: routeguard_password
    ports:
      - "5438:5432"
    volumes:
      - routeguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U routeguard_user -d routeguard_db
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: routeguard-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8087:8080"

volumes:
  routeguard_postgres_data: